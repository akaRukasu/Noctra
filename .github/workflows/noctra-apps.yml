# Construit les applications Noctra : Android / Android TV (APK), iOS (IPA non
# signée, à installer avec Sideloadly ou AltStore), LG webOS (IPK) et Samsung
# Tizen (WGT, signé à l'installation par Apps2Samsung).
# Les fichiers sont téléchargeables dans l'onglet Actions (« Artifacts »). Une
# étiquette apps-v* (ex. apps-v1.0.0) publie aussi une Release GitHub.
name: Applications Noctra

on:
  push:
    paths:
      - 'apps/**'
      # Applis natives iOS 26 et Android : leurs propres workflows.
      - '!apps/ios-native/**'
      - '!apps/android-native/**'
      - 'public/noctra-app-bridge.js'
      - '.github/workflows/noctra-apps.yml'
    tags:
      - 'apps-v*'
  pull_request:
    paths:
      - 'apps/**'
      - '!apps/ios-native/**'
      - '!apps/android-native/**'
      - 'public/noctra-app-bridge.js'
      - '.github/workflows/noctra-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule la construction devenue obsolète.
concurrency:
  group: noctra-apps-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tv:
    name: LG webOS + Samsung Tizen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paquets TV
        run: node apps/scripts/build-tv.mjs
      - name: Contrôle des archives
        run: |
          cd dist/apps
          ar t com.noctra.media_*_all.ipk
          unzip -t Noctra.wgt
      - uses: actions/upload-artifact@v4
        with:
          name: noctra-tv
          path: |
            dist/apps/*.ipk
            dist/apps/*.wgt
          if-no-files-found: error

  android:
    name: Android + Android TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clé de signature (facultative)
        env:
          KEYSTORE_BASE64: ${{ secrets.NOCTRA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noctra.p12"
            echo "NOCTRA_KEYSTORE_FILE=$RUNNER_TEMP/noctra.p12" >> "$GITHUB_ENV"
          else
            echo "::notice::Aucune clé NOCTRA_KEYSTORE_BASE64 : APK signé avec une clé temporaire (voir apps/README.md)."
          fi
      # Même construction que sur un PC : apps/scripts/build-android.mjs.
      - name: APK
        env:
          NOCTRA_KEYSTORE_PASSWORD: ${{ secrets.NOCTRA_KEYSTORE_PASSWORD }}
          NOCTRA_KEY_ALIAS: ${{ secrets.NOCTRA_KEY_ALIAS }}
          NOCTRA_KEY_PASSWORD: ${{ secrets.NOCTRA_KEY_PASSWORD }}
        run: node apps/scripts/build-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: noctra-android
          path: dist/apps/Noctra-android.apk
          if-no-files-found: error

  # APK Android TV : construit par le workflow « Noctra Android » seulement, avec
  # la clé de signature de toutes ses versions (une clé différente ici empêchait
  # l'installation par-dessus : « Application non installée »).

  ios:
    # Ancienne appli iOS « interface web » (apps/ios). La vraie appli iPhone/iPad
    # est l'appli native : workflow « Noctra iOS 26 », Artifacts › noctra-ios26.
    name: iOS ancienne interface web (pas l'appli native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: IPA non signée
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project Noctra.xcodeproj -target Noctra -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build
          mkdir -p Payload ../../dist/apps
          cp -R build/Release-iphoneos/Noctra.app Payload/
          zip -qry ../../dist/apps/Noctra-Web-ancienne-interface-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: noctra-ios-ancienne-interface-web
          path: dist/apps/Noctra-Web-ancienne-interface-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Release GitHub
    if: startsWith(github.ref, 'refs/tags/apps-v')
    needs: [tv, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Applications Noctra ${{ github.ref_name }}
          files: dist/*
          body: |
            - Android TV : APK dans le workflow « Noctra Android » (Artifacts › noctra-androidtv).
            - **Noctra-android.apk** : téléphones et tablettes Android.
            - iPhone et iPad : la vraie appli est **Noctra-ios26-unsigned.ipa** (workflow « Noctra iOS 26 », Artifacts › noctra-ios26).
            - **Noctra-Web-ancienne-interface-ios-unsigned.ipa** : ancienne interface web (« Noctra Web », appli séparée).
            - **com.noctra.media_…_all.ipk** : téléviseurs LG webOS (mode développeur).
            - **Noctra.wgt** : téléviseurs Samsung Tizen, à installer avec Apps2Samsung.

            Instructions : apps/README.md
