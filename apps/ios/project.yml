# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen generate`
name: Noctra
options:
  bundleIdPrefix: com.noctra
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  Noctra:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Noctra
      # Écran de connexion partagé avec les applis Android et TV.
      - path: ../shared/launcher
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noctra.app
        PRODUCT_NAME: Noctra
        INFOPLIST_FILE: Noctra/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme: {}
